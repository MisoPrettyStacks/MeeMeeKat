<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCT Memecoin Mass Analyzer</title>
    <!-- Tailwind CSS for modern dark-mode styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400 tracking-tight flex items-center gap-2">➡️ Temporal Composition Theory Analyzer</h1>
                <p class="text-slate-400 text-sm">Calculates real-time token structural mass and entropic decay limits.</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <input id="tokenAddress" type="text" placeholder="Enter Solana Token Mint Address..." 
                       value="6p6H7JgYbdS29yS1WdhYmo7Q2g1v9cZgB3DDB8m9pump" 
                       class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 flex-1 md:w-80">
                <button onclick="analyzeToken()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition cursor-pointer">Analyze</button>
            </div>
        </header>

        <!-- Main Dashboard Widgets -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Metrics Panel -->
            <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
                <h2 class="text-md font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">📊 Live Force Metrics</h2>
                
                <div class="p-4 bg-slate-950 rounded-lg border border-slate-850">
                    <span class="text-xs text-slate-400 block mb-1">TCT System Status</span>
                    <div id="statusBadge" class="text-md font-black uppercase text-slate-500">Awaiting Input...</div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-slate-950 rounded-lg">
                        <span class="text-xs text-slate-400 block">Temporal Mass</span>
                        <span id="metricMass" class="text-lg font-bold text-amber-400">-</span>
                    </div>
                    <div class="p-3 bg-slate-950 rounded-lg">
                        <span class="text-xs text-slate-400 block">Entropy Vector</span>
                        <span id="metricEntropy" class="text-lg font-bold text-rose-400">-</span>
                    </div>
                </div>

                <div class="space-y-2 border-t border-slate-800 pt-4 text-sm">
                    <div class="flex justify-between"><span class="text-slate-400">Token Name:</span><span id="tokName" class="font-semibold">-</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Price USD:</span><span id="tokPrice" class="font-semibold">-</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">24h Vol:</span><span id="tokVol" class="font-semibold">-</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Liquidity Depth:</span><span id="tokLiq" class="font-semibold">-</span></div>
                </div>
            </section>

            <!-- Chart Panel -->
            <section class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5">
                <h2 class="text-md font-bold text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">📈 High Entropy vs Coherence Mapping</h2>
                <div class="h-64 w-full flex items-center justify-center relative">
                    <canvas id="tctChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        let chartInstance = null;

        async function analyzeToken() {
            const address = document.getElementById('tokenAddress').value.trim();
            if(!address) return alert("Please enter a valid token address");

            try {
                // Fetching entirely free public on-chain metrics from DexScreener API
                const res = await fetch(`https://dexscreener.com{address}`);
                const data = await res.json();
                
                if(!data.pairs || data.pairs.length === 0) {
                    alert("Token pair profile not found on DexScreener.");
                    return;
                }

                const pair = data.pairs[0];
                
                // Extract metrics to populate the TCT mathematical formula
                const name = pair.baseToken.name + ` (${pair.baseToken.symbol})`;
                const price = parseFloat(pair.priceUsd || 0);
                const volume24h = parseFloat(pair.volume?.h24 || 0);
                const liquidity = parseFloat(pair.liquidity?.usd || 0);
                
                const buys = parseFloat(pair.txns?.h24?.buys || 1);
                const sells = parseFloat(pair.txns?.h24?.sells || 1);

                // Compute Instantaneous Attention (\tau_k) and Entropic Decay (S)
                const tau_k = volume24h * Math.log1p(buys);
                const entropy = (sells / Math.max(buys, 1)) * 1.2; // Proxy concentration weight 1.2
                
                // Update text UI values
                document.getElementById('tokName').innerText = name;
                document.getElementById('tokPrice').innerText = '$' + price.toLocaleString(undefined, {maximumFractionDigits: 6});
                document.getElementById('tokVol').innerText = '$' + volume24h.toLocaleString();
                document.getElementById('tokLiq').innerText = '$' + liquidity.toLocaleString();
                
                // Assess system boundary state (Crossing 1.0 limit thresholds)
                const badge = document.getElementById('statusBadge');
                if (entropy >= 1.0) {
                    badge.innerText = "⚠️ Terminal Decay Phase";
                    badge.className = "text-md font-black uppercase text-rose-500 bg-rose-950/40 p-2 rounded border border-rose-900/50 text-center";
                } else {
                    badge.innerText = "✅ Accumulating Mass";
                    badge.className = "text-md font-black uppercase text-emerald-400 bg-emerald-950/40 p-2 rounded border border-emerald-900/50 text-center";
                }

                // Model continuous timeline paths
                generateTctChart(tau_k, entropy, pair.marketCap || (price * 1000000000));

            } catch (err) {
                console.error(err);
                alert("Failed fetching free market telemetry data.");
            }
        }

        function generateTctChart(baseTau, targetEntropy, marketCap) {
            const timeLabels = [];
            const massData = [];
            const entropyData = [];
            
            let currentMass = 1000; // Baseline structural tracking unit
            const intervals = 24; 

            for(let i = 0; i <= intervals; i++) {
                timeLabels.push(`Hour ${i}`);
                
                // Replicate high-entropy memecoin lifecycle curve shapes
                let timeFactor = i / 6;
                let tau_t = baseTau * timeFactor * Math.exp(-0.6 * timeFactor);
                let entropy_t = (targetEntropy * 0.3) + (targetEntropy * 0.12 * i);
                
                let deltaMass = tau_t * (1 - entropy_t);
                currentMass = Math.max(0, currentMass + deltaMass);
                
                // Map out clean relational ratios relative to maximum scale indexes
                massData.push(currentMass);
                entropyData.push(entropy_t);
            }

            document.getElementById('metricMass').innerText = massData[massData.length-1].toLocaleString(undefined, {maximumFractionDigits:0});
            document.getElementById('metricEntropy').innerText = targetEntropy.toFixed(2);

            // Destroy historical instance loops to prevent graph layout ghosting overlays
            if(chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('tctChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [
                        {
                            label: 'Temporal Mass (m)',
                            data: massData,
                            borderColor: '#fbbf24',
                            backgroundColor: 'rgba(251, 191, 36, 0.05)',
                            yAxisID: 'yMass',
                            borderWidth: 3,
                            tension: 0.3
                        },
                        {
                            label: 'Entropy (η·S)',
                            data: entropyData,
                            borderColor: '#f43f5e',
                            borderDash: [5, 5],
                            yAxisID: 'yEntropy',
                            borderWidth: 2,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        yMass: {
                            type: 'linear',
                            position: 'left',
