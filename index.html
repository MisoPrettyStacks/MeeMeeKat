<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCT Live Historical Terminal</title>
    <!-- Tailwind CSS for modern dark-mode styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-pulse-fast { animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400 tracking-tight flex items-center gap-2">➡️ TCT Live Historical Tracker</h1>
                <p class="text-slate-400 text-sm">Real-time historical token data injection. Zero mathematical simulations.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                <input id="tokenAddress" type="text" placeholder="Enter Token Mint Address..." 
                       value="6p6H7JgYbdS29yS1WdhYmo7Q2g1v9cZgB3DDB8m9pump"
                       class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-amber-400 w-full sm:w-80">
                <button onclick="analyzeLiveToken()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition cursor-pointer whitespace-nowrap">Load Asset</button>
            </div>
        </header>

        <!-- Main Display Layout Matrix -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Side Watchlist Tracker -->
            <aside class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4 lg:col-span-1">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">📋 Monitored Assets</h2>
                    <button onclick="clearCache()" class="text-[10px] uppercase text-rose-400 font-bold hover:text-rose-300 cursor-pointer">Clear</button>
                </div>
                <div id="watchlistContainer" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
            </aside>

            <!-- Charting and Real Stats Display -->
            <main class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:col-span-3">
                <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-5">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">📊 Live Metadata</h2>
                    
                    <div class="p-4 bg-slate-950 rounded-lg border border-slate-850 text-center">
                        <span class="text-xs text-slate-400 block mb-1">Current TCT State</span>
                        <div id="statusBadge" class="text-xs font-black uppercase text-slate-500 py-1">Awaiting Data...</div>
                    </div>

                    <div class="space-y-2 border-t border-slate-800 pt-4 text-xs">
                        <div class="flex justify-between"><span class="text-slate-400">Asset Label:</span><span id="metaName" class="font-semibold text-slate-200">-</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Current Price:</span><span id="metaPrice" class="font-semibold text-slate-200">-</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Chain/Dex ID:</span><span id="metaDex" class="font-semibold text-slate-200">-</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Total Liquidity:</span><span id="metaLiq" class="font-semibold text-slate-200">-</span></div>
                    </div>
                </section>

                <!-- Chart Viewport (Real History) -->
                <section class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">📈 Live Price History & TCT Event Markers</h2>
                    <div class="h-72 w-full relative">
                        <canvas id="liveTctChart"></canvas>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        let chartInstance = null;
        let activeAddress = "";
        let trackedTokens = JSON.parse(localStorage.getItem('tct_live_cache')) || ["6p6H7JgYbdS29yS1WdhYmo7Q2g1v9cZgB3DDB8m9pump"];

        async function initApp() {
            renderWatchlist();
            if(trackedTokens.length > 0) {
                loadTokenData(trackedTokens[0]);
            }
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlistContainer');
            container.innerHTML = "";
            trackedTokens.forEach(addr => {
                const activeStyle = addr === activeAddress ? 'border-amber-500 bg-slate-800/60' : 'border-slate-800 bg-slate-950 hover:bg-slate-900';
                container.innerHTML += `
                    <div onclick="loadTokenData('${addr}')" class="p-3 border rounded-xl flex justify-between items-center transition cursor-pointer ${activeStyle}">
                        <div class="truncate text-xs font-mono text-slate-300">${addr.substring(0,6)}...${addr.substring(addr.length-4)}</div>
                        <div class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">LIVE</div>
                    </div>
                `;
            });
        }

        function addTokenToWatchlist() {
            const input = document.getElementById('tokenAddress');
            const addr = input.value.trim();
            if(!addr) return;
            if(!trackedTokens.includes(addr)) {
                trackedTokens.push(addr);
                localStorage.setItem('tct_live_cache', JSON.stringify(trackedTokens));
                renderWatchlist();
            }
            loadTokenData(addr);
            input.value = "";
        }

        function clearCache() {
            if(confirm("Clear cached watchlist?")) {
                trackedTokens = [];
                localStorage.removeItem('tct_live_cache');
                renderWatchlist();
            }
        }

        async function loadTokenData(addr) {
            activeAddress = addr;
            renderWatchlist();

            try {
                // Step 1: Query profile data to retrieve target pool information
                const profileRes = await fetch(`https://dexscreener.com{addr}`);
                const profileData = await profileRes.json();
                if(!profileData.pairs || profileData.pairs.length === 0) return alert("Token profile pairs not found.");

                const mainPair = profileData.pairs[0];
                document.getElementById('metaName').innerText = `${mainPair.baseToken.name} (${mainPair.baseToken.symbol})`;
                document.getElementById('metaPrice').innerText = `$${parseFloat(mainPair.priceUsd || 0).toLocaleString(undefined, {maximumFractionDigits: 6})}`;
                document.getElementById('metaDex').innerText = `${mainPair.chainId} / ${mainPair.dexId}`;
                document.getElementById('metaLiq').innerText = `$${parseFloat(mainPair.liquidity?.usd || 0).toLocaleString()}`;

                // Step 2: Request 100% Real Historical Bars data directly from DexScreener chart routes
                const chartRes = await fetch(`https://dexscreener.com{mainPair.chainId}/${mainPair.id}?type=1h&count=24`);
                const chartData = await chartRes.json();
                
                if(!chartData.bars || chartData.bars.length === 0) return alert("Historical structural charts could not be read.");

                processHistoricalBars(chartData.bars);

            } catch (err) {
                console.error(err);
                alert("Failed connecting to live chart streams.");
            }
        }

        function processHistoricalBars(bars) {
            // Reverse incoming array values to ensure strict left-to-right temporal progression
            const cleanBars = bars.slice().reverse();
            
            const timeLabels = [];
            const priceData = [];
            const pointColors = [];
            const pointRadius = [];
            
            let alphaFound = false;
            let currentStateText = "✅ Balanced Matrix State";
            let currentStatusClass = "text-emerald-400 bg-emerald-950/40 border border-emerald-900/50";

            cleanBars.forEach((bar, index) => {
                const date = new Date(bar.timestamp);
                timeLabels.push(`${date.getHours()}:00`);
                
                const closePrice = parseFloat(bar.close);
                priceData.push(closePrice);

                // Pull actual transactional volume telemetry per time-block slice
                const buys = parseFloat(bar.txns?.buys || 1);
                const sells = parseFloat(bar.txns?.sells || 1);
                
                // Pure TCT calculations using live historical transaction data
                const entropy = sells / Math.max(buys, 1);
                const isAlphaRamp = buys >= (sells * 1.5) && entropy < 0.60;

                // Mark coordinates directly onto the live chart timeline based on data metrics
                if (entropy >= 1.0) {
